<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const V3 = THREE.Vector3, PI = Math.PI, $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const prog = (p, t) => { $('#lb').style.width = p + '%'; $('#lt').textContent = t; };

/* ---------- renderer ---------- */
const W = () => innerWidth, H = () => innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75)); renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('#c3d').appendChild(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.setSize(W(), H()); $('#labels').appendChild(labelR.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020814); scene.fog = new THREE.Fog(0x020814, 600, 2200);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(42, W() / H(), 1, 9000); camera.position.set(1100, 900, 800);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.maxPolarAngle = 1.48; controls.minDistance = 8; controls.maxDistance = 2600; controls.target.set(200, 0, -300); controls.autoRotateSpeed = 0.5;
const hemi = new THREE.HemisphereLight(0xa8ccff, 0x0b1830, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, near: 10, far: 1400 }); sun.shadow.bias = -0.0006; scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x5aa0ff, 0.45); fill.position.set(-150, 80, -100); scene.add(fill);
const rt = new THREE.WebGLRenderTarget(W(), H(), { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt); composer.addPass(new RenderPass(scene, camera));
const outline = new OutlinePass(new THREE.Vector2(W(), H()), scene, camera);
Object.assign(outline, { edgeStrength: 5, edgeGlow: 0.8, edgeThickness: 1.5, pulsePeriod: 2 }); outline.visibleEdgeColor.set(0x38f3ff); outline.hiddenEdgeColor.set(0x0d5f88); composer.addPass(outline);
const bloom = new UnrealBloomPass(new THREE.Vector2(W(), H()), 0.55, 0.5, 0.82); composer.addPass(bloom); composer.addPass(new OutputPass());

/* ---------- materials & geometry ---------- */
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .55, metalness: .2, envMapIntensity: .6, ...o });
const MAT = {
  concrete: M(0x8a929b, { roughness: .9, metalness: 0 }), steel: M(0x9fadbb, { metalness: .7, roughness: .35 }), tank: M(0x8796a4, { metalness: .55, roughness: .42 }),
  porcelain: M(0xe2e6eb, { roughness: .22, metalness: .05 }), alum: M(0xd9e0e8, { metalness: .9, roughness: .22 }), gis: M(0xc9d2dc, { metalness: .35, roughness: .32 }),
  dark: M(0x37424f, { metalness: .4, roughness: .6 }), gravel: M(0x222a33, { roughness: 1, metalness: 0 }), wall: M(0xa7aeb6, { roughness: .85, metalness: 0 }),
  coil: M(0x4f5c69, { metalness: .3, roughness: .5 }), orange: M(0xc8662e, { roughness: .6 }), blueRoof: M(0x2463d0, { roughness: .35, metalness: .35 }),
  roofGray: M(0x5f6a77, { roughness: .8 }), white: M(0xe8eef5, { roughness: .6 }), road: M(0x161e29, { roughness: .95, metalness: 0 }), cableCover: M(0x55606c, { roughness: .9 }),

  const b = $('#iBtns'); b.innerHTML = ''; const add = (t, f) => { const d = document.createElement('div'); d.textContent = t; d.onclick = f; b.appendChild(d); };
  if (inf.enter) add('进入配电室', () => goZone('room')); add('三维拓扑', () => setVB('topo', true)); add('关闭', hideInfo);
  if (EC) { const base = 50 + Math.random() * 30; chs.info.setOption({ xAxis: { data: Array.from({ length: 24 }, (_, i) => i + 'h') }, series: [{ data: Array.from({ length: 24 }, (_, i) => +(base + 15 * Math.sin(i / 3.8) + Math.random() * 6).toFixed(1)) }] }); chs.info.resize(); } }
function fillInfo() { if (!infoObj) return; const inf = infoObj.userData.info, f = FIELDS[inf.type]; const rows = f ? f(infoObj) : [['状态', badge('运行')]]; $('#iBody').innerHTML = rows.map(([k, v]) => `<div class="irow"><span>${k}</span><b>${v}</b></div>`).join(''); }
function hideInfo() { infoObj = null; $('#info').style.display = 'none'; outline.selectedObjects = []; }
$('#ix').onclick = hideInfo;
// view buttons
const vbOn = v => $(`.vbtn[data-v="${v}"]`).classList.contains('on');
function setVB(v, on) { const b = $(`.vbtn[data-v="${v}"]`); b.classList.toggle('on', on);
  if (v === 'flow') { flowOn = on; for (const f of [flowHV, flowCable, flowGen, flowFeeder, flowLV]) f.obj.visible = on; }
  if (v === 'topo') { topoG.visible = on && !inRoom; if (on && !inRoom) { pushEv('三维设备拓扑叠加显示', '', null); } }
  if (v === 'drone') { follow = on ? 'drone' : (follow === 'drone' ? null : follow); if (on) { if (inRoom) leaveRoom(); setVB('patrol', false); follow = 'drone'; } }
  if (v === 'patrol') { if (on) { if (inRoom) leaveRoom(); $(`.vbtn[data-v="drone"]`).classList.remove('on'); follow = 'robot'; } else if (follow === 'robot') follow = null; }
  if (v === 'roam') controls.autoRotate = on;
  if (v === 'xray') { xray = on; world.traverse(o => { if (!o.isMesh || !o.material || o.material.isShaderMaterial) return; for (const m of [].concat(o.material)) { if (m.userData.x === undefined) m.userData.x = [m.transparent, m.opacity, m.depthWrite]; if (on) { m.transparent = true; m.opacity = Math.min(m.userData.x[1], .22); m.depthWrite = false; } else [m.transparent, m.opacity, m.depthWrite] = m.userData.x; m.needsUpdate = true; } }); }
  if (v === 'label') labelsOn = on; }
document.querySelectorAll('.vbtn').forEach(b => b.onclick = () => setVB(b.dataset.v, !b.classList.contains('on')));
document.querySelectorAll('.nb').forEach(n => n.onclick = () => goZone(n.dataset.n));
$('#topoH').onclick = () => $('#topo2d').classList.toggle('min');
$('#bPlay').onclick = () => { S.play = !S.play; $('#bPlay').classList.toggle('on', S.play); $('#bPlay').textContent = S.play ? '⏸ 暂停时间' : '▶ 时间流逝'; };
$('#bDR').onclick = demandResp; $('#bLight').onclick = lightning; $('#bFeeder').onclick = feederFault;
const sT = $('#sTime'), sW = $('#sWind'), sC = $('#sCloud');
sT.oninput = () => { S.h = +sT.value; updDay(); }; sW.oninput = () => { S.wind = +sW.value; updDay(); if (S.wind > 25) pushEv(`风速 ${S.wind}m/s 超切出风速，风机顺桨停机保护`, 'al', turbines[0].g); }; sC.oninput = () => { S.cloud = sC.value / 100; updDay(); };
function syncCtl() { sT.value = S.h; $('#vTime').textContent = hhmm(S.h); $('#vWind').textContent = S.wind + ' m/s'; $('#vCloud').textContent = Math.round(S.cloud * 100) + ' %'; }
// picking
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); ray.params.Line.threshold = .3; ray.params.Points.threshold = 0;
function pick(e) { mouse.set(e.clientX / W() * 2 - 1, -e.clientY / H() * 2 + 1); ray.setFromCamera(mouse, camera);
  const list = inRoom ? [cabs] : pickables.filter(p => p !== cabs); const hit = ray.intersectObjects(list, true)[0]; if (!hit) return null;
  if (hit.object === cabs) return { o: cabs, cab: hit.instanceId }; let o = hit.object; while (o && !o.userData.info) o = o.parent; return o ? { o } : null; }
let hoverT = 0, downP = null;
renderer.domElement.addEventListener('pointermove', e => { if (performance.now() - hoverT < 60) return; hoverT = performance.now(); const r = pick(e), tip = $('#tip');
  if (r) { tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px'; tip.textContent = r.cab !== undefined ? `开关柜 ${cabInfo[r.cab].id}${r.cab === ALARM_CAB ? ' ⚠ 温度越限' : ''}` : r.o.userData.info.name; renderer.domElement.style.cursor = 'pointer'; if (!infoObj && r.cab === undefined) outline.selectedObjects = [r.o]; }
  else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; if (!infoObj) outline.selectedObjects = []; } });
renderer.domElement.addEventListener('pointerdown', e => downP = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => { if (!downP || Math.hypot(e.clientX - downP[0], e.clientY - downP[1]) > 5) return; const r = pick(e); if (!r) return;
  if (r.cab !== undefined) { const c = cabInfo[r.cab]; infoObj = null; $('#info').style.display = 'block'; $('#iTitle').textContent = `开关柜 ${c.id}`; $('#iBody').innerHTML = [['电压', '35 kV'], ['断路器', r.cab === ALARM_CAB ? badge('合位') : badge('合位')], ['触头温度', r.cab === ALARM_CAB ? badge('68.2 ℃ 越限', 'al') : (30 + Math.random() * 6).toFixed(1) + ' ℃'], ['局放', '2.4 pC'], ['电流', (180 + Math.random() * 60).toFixed(0) + ' A']].map(([k, v]) => `<div class="irow"><span>${k}</span><b>${v}</b></div>`).join(''); $('#iBtns').innerHTML = '<div id="bOut">返回全景</div>'; $('#bOut').onclick = () => goZone('all'); flyTo(c.pos.clone().add(new V3(0, 3, c.pos.z < 0 ? 6 : -6)), c.pos.clone()); return; }
  focus(r.o); });
renderer.domElement.addEventListener('dblclick', e => { const r = pick(e); if (r && r.o.userData.info?.enter) goZone('room'); });

/* =================== 场景告警 =================== */
let alarmObj = null;
function randAlarm() { if (inRoom || alarmObj) return; const pool = [...equip.transformer, ...equip.bay, ...(equip.dtx || []), ...(equip.boxtx || [])], o = pool[Math.floor(Math.random() * pool.length)];
  const t = ['红外测温：接头温度 78℃ 越限', '油色谱乙炔含量异常', 'SF6 压力低告警', '局部放电幅值超阈值'][Math.floor(Math.random() * 4)]; alarmObj = o;
  const c = new THREE.Box3().setFromObject(o).getCenter(new V3()); alarmRing.position.set(c.x, .3, c.z); alarmRing.visible = true; alarms++;
  pushEv(`⚠ ${o.userData.info.name}：${t}`, 'al', o); later(9, () => { alarmRing.visible = false; alarmObj = null; alarms--; pushEv(`${o.userData.info.name} 告警已确认/消缺`, 'ok', o); }); }

/* =================== 构建粒子 & 线 =================== */
for (const f of [flowHV, flowCable, flowGen, flowFeeder, flowLV]) f.build(world);
segs(wirePts, WIRE); segs(dashPts, new THREE.LineBasicMaterial({ color: 0x6f7f90, transparent: true, opacity: .6 }));
const vecTmp = new V3();

/* =================== 主循环 =================== */
const clk = new THREE.Clock(); let fr = 0, acc = 0, slow = 0;
function loop() { requestAnimationFrame(loop); const dt = Math.min(clk.getDelta(), .1), t = clk.elapsedTime; fr++;
  if (S.play) { S.h = (S.h + dt / 12) % 24; }
  acc += dt; if (acc > .25) { acc = 0; model(); solve(); drawTopo(); light(); syncCtl(); if (++slow % 4 === 0) { updPanel(); fillInfo(); sample(); updZoneChart(); if (slow % 40 === 0) updDay(); } }
  if (anim) { const k = clamp((performance.now() - anim.s) / anim.d, 0, 1), e = ease(k); camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e); if (k >= 1) anim = null; }
  // flows
  if (flowOn && !inRoom) { flowHV.update(t, p => p.tag ? gateOf(p.tag) : E['SY-SUB'].dir); flowCable.update(t, p => p.tag ? gateOf(p.tag) : powered.SUB ? 1 : 0); flowFeeder.update(t, p => gateOf(p.tag)); flowLV.update(t, p => gateOf(p.tag));
    flowGen.update(t, p => p.tag === 'PV' ? (S.solar > 1 ? 1 : 0) : p.tag === 'WF' ? (S.windP > .3 ? 1 : 0) : p.tag === 'ES' ? Math.sign(Math.round(S.esP)) : 1); }
  if (topoG.visible) topoFlow.update(t, p => gateOf(p.tag));
  // generation anims
  const thk = S.th / 1320; steams[0].update(dt, S.wind / 28, .6 + thk); steams[1].update(dt, S.wind / 28, .6 + thk); steams[2].update(dt, S.wind / 28, 1);
  turbines.forEach((tb, i) => { const p = S.wt[i] || 0; tb.rotor.rotation.z += dt * (p ? .6 + p * .22 : (S.wind * wtSeed[i] > 25 ? 0 : .05)); tb.led.visible = Math.sin(t * 4 + i) > 0; });
  chim.userData.lights.forEach((l, i) => l.visible = Math.sin(t * 3 + i) > -.2);
  // drone & robot
  { const z = -275 + 150 * Math.sin(t * .07), z2 = -275 + 150 * Math.sin((t + .1) * .07); drone.position.set(10 + 5 * Math.sin(t * .5), 58 + Math.sin(t * 1.3) * 1.5, z); drone.rotation.y = z2 > z ? 0 : PI; drone.userData.rot.forEach((r, i) => r.rotation.y += dt * 40 * (i % 2 ? 1 : -1)); }
  { const u = (t * 2.2 / patrolLen) % 1, p = patrolPath.getPointAt(u), q = patrolPath.getPointAt((u + .002) % 1); robot.position.copy(p); robot.lookAt(q.x, p.y, q.z); robot.userData.lid.rotation.y += dt * 3; }
  if (follow === 'drone') { drone.getWorldPosition(vecTmp); controls.target.lerp(vecTmp, .1); camera.position.lerp(vecTmp.clone().add(new V3(45, 22, 40)), .05); }
  if (follow === 'robot') { robot.getWorldPosition(vecTmp); controls.target.lerp(vecTmp, .12); const back = new V3(0, 0, -14).applyQuaternion(robot.quaternion); camera.position.lerp(vecTmp.clone().add(back).add(new V3(0, 9, 0)), .06); }
  updCars(t); evLeds.forEach((l, i) => l.visible = powered.EV && (i % 3 !== 2 ? Math.sin(t * 3 + i) > -.5 : true));
  riverMat.uniforms.uT.value = t; scanMat.uniforms.uT.value = t; if (alarmRing.visible) { const s = 1 + (t * 1.5 % 1) * 2.5; alarmRing.scale.setScalar(s); alarmRing.material.opacity = 1 - (t * 1.5 % 1); }
  // room
  if (inRoom) { railBot.position.x = Math.sin(t * .25) * 19; const c = new THREE.Color(Math.sin(t * 8) > 0 ? 0xff3030 : 0xffffff); cabs.setColorAt(ALARM_CAB, c); cabs.instanceColor.needsUpdate = true; roomFlow.p[0].pts[0].copy(railBot.position); roomFlow.p[0].len = roomFlow.p[0].pts[1].distanceTo(railBot.position); roomFlow.p[0].cum[1] = roomFlow.p[0].len; roomFlow.update(t); }
  // shadows/fog follow
  const dist = camera.position.distanceTo(controls.target); if (!inRoom) { scene.fog.near = dist * .7 + 100; scene.fog.far = dist * 3 + 900; }
  const sd = sun.userData.dir || new V3(1, 1, .5).normalize(); sun.target.position.copy(controls.target); sun.position.copy(controls.target).addScaledVector(sd, 700);
  const sc = clamp(dist * .5, 120, 700); Object.assign(sun.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc }); sun.shadow.camera.updateProjectionMatrix();
  // labels
  if (fr % 15 === 1) { for (const l of labels) { let v = labelsOn; if (v) { if (l.userData.topo) v = topoG.visible; else { let p = l.parent; while (p) { if (!p.visible) { v = false; break; } p = p.parent; } if (v) { l.getWorldPosition(vecTmp); v = vecTmp.distanceTo(camera.position) < l.userData.md * (dist > 1200 ? 1.6 : 1); } } } l.visible = v; } }
  controls.update(); composer.render(); labelR.render(scene, camera); }

addEventListener('resize', () => { camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H()); composer.setSize(W(), H()); labelR.setSize(W(), H()); outline.setSize?.(W(), H()); Object.values(chs).forEach(c => c.resize()); });

/* =================== 启动 =================== */
prog(100, '数字孪生就绪');
model(); solve(); drawTopo(); light(); updDay(); for (let i = 0; i < 20; i++) sample(); setZone('all'); syncCtl(); $('#bPlay').classList.add('on'); $('#bPlay').textContent = '⏸ 暂停时间';
pushEv('全场景电网数字孪生系统启动 · 接入设备 1846 台', 'ok'); pushEv('发电侧 AGC 投入 · 新能源优先消纳', 'ok', units[0]); pushEv('10kV 配电自动化 FA 主站在线', 'ok', dsB);
setInterval(randAlarm, 38000); later(12, randAlarm);
loop(); setTimeout(() => { $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 900); window.__ready = true; }, 400);
flyTo(new V3(1100, 900, 800), new V3(200, 0, -300), .1);


</script>
